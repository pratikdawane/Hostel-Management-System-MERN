server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing, so any path that isn't a
    # real file (e.g. a hard refresh on /allocations) must fall back to
    # index.html and let the SPA's router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's hashed JS/CSS filenames -
    # if a browser caches it, a fresh deploy can silently keep serving an
    # old bundle. Assets below are content-hashed and safe to cache forever;
    # this must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
