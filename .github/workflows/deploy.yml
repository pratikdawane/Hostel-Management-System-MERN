name: Deploy

# Runs after CI succeeds on main, or manually via the Actions tab.
# SSHes into an existing server, pulls the latest code, regenerates the
# secret-bearing .env files from GitHub Secrets, and brings the
# production-style Compose stack up.
#
# Requires a server with Docker + Docker Compose v2 already installed and
# this repo already `git clone`d on it - see docs/specs/DEPLOYMENT-DOCKER.md
# "CI/CD deploy" section for the one-time setup and the full list of
# repository secrets this workflow needs.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main

            cat > .env <<'ENVEOF'
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_ACCESS_EXPIRES_IN=${{ secrets.JWT_ACCESS_EXPIRES_IN }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
            ENVEOF

            docker compose -f docker-compose.yml up -d --build
