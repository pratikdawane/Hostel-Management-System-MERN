# Production-style stack: builds real images (backend + nginx-served frontend)
# and runs them together with MongoDB.
#
#   docker compose -f docker-compose.yml up -d --build
#
# (Plain `docker compose up` instead auto-merges docker-compose.override.yml,
# which swaps this into a hot-reload dev setup - see that file's header.)

name: hostel-management-system

services:
  mongo:
    image: mongo:7
    container_name: hostel-mongo
    restart: unless-stopped
    volumes:
      - hostel-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hostel-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hostel-backend
    restart: unless-stopped
    environment:
      # Every value here is read from the shell / CI environment or the root
      # .env file Compose auto-loads (see .env.docker.example) - nothing is
      # hardcoded, so the same compose file works for local dev and for the
      # GitHub Actions deploy workflow (.github/workflows/deploy.yml), which
      # populates these from repository secrets.
      NODE_ENV: production
      PORT: 5000
      # Container-to-container traffic: "mongo" is the Compose service name,
      # resolved over the internal Docker network - not reachable from the
      # browser. Override only if pointing at an external Mongo (e.g. Atlas).
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/hostel_management}
      # Real secrets - no safe default, must come from the environment.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Must match the origin the BROWSER loads the frontend from (the
      # published frontend port below), for CORS + cookie scoping.
      CLIENT_URL: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hostel-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the static bundle at BUILD time - must be reachable from
        # the browser, so it points at the PUBLISHED backend port, not the
        # internal service name "backend".
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: hostel-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - hostel-network

volumes:
  hostel-mongo-data:
    name: hostel-mongo-data

networks:
  hostel-network:
    name: hostel-network
